<!DOCTYPE html>
<!-- Generated by build_index.py from reports/*.html metadata. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="topic-title" content="{{TOPIC_DISPLAY_NAME}}">
<meta name="topic-description" content="{{TOPIC_DESCRIPTION}}">
<meta name="source-repository" content="{{SOURCE_REPOSITORY}}">
<title>{{TOPIC_DISPLAY_NAME}} — Paper Reading</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <p class="eyebrow">Paper Reading Library</p>
  <h1>{{TOPIC_DISPLAY_NAME}}</h1>
  <p>{{TOPIC_DESCRIPTION}} · 共 {{PAPER_COUNT}} 篇</p>
</header>

<main class="index-wrap">
  <section id="topic-home" aria-labelledby="topic-home-title">
    <div class="section-heading">
      <div>
        <p class="section-kicker">第一级</p>
        <h2 id="topic-home-title">选择研究主题</h2>
      </div>
      <p>一篇论文可以属于多个主题。</p>
    </div>
    <div class="topic-grid" id="topic-grid">
{{TOPIC_FOLDERS}}
    </div>
  </section>

  <section id="topic-view" hidden aria-labelledby="active-topic-title">
    <nav class="breadcrumbs" aria-label="当前位置">
      <button id="back-to-topics" type="button">所有主题</button>
      <span>/</span>
      <strong id="active-topic-title"></strong>
    </nav>

    <div class="topic-toolbar">
      <label class="search-box">
        <span class="search-label">搜索论文</span>
        <input id="paper-search" type="search" placeholder="标题、摘要、会议或方法标签" autocomplete="off">
      </label>
      <div>
        <p class="filter-label">第二级：方法标签</p>
        <div class="tag-filters" id="tag-filters" aria-label="按方法标签筛选"></div>
      </div>
      <div class="toolbar-footer">
        <span class="result-count" id="result-count" aria-live="polite"></span>
        <button id="export-edits" class="text-command" type="button">导出本地分类修改</button>
      </div>
    </div>

    <div class="paper-grid" id="paper-grid">
{{PAPER_CARDS}}
    </div>
    <p class="empty-results" id="empty-results" hidden>当前主题下没有匹配的论文。</p>
  </section>
</main>

<dialog class="taxonomy-dialog" id="taxonomy-dialog">
  <form method="dialog" id="taxonomy-form">
    <div class="dialog-heading">
      <div>
        <p class="section-kicker">编辑分类</p>
        <h2 id="taxonomy-paper-title">论文</h2>
      </div>
      <button class="icon-button" value="cancel" aria-label="关闭" title="关闭">×</button>
    </div>
    <label>
      <span>一级主题</span>
      <input id="taxonomy-topics" type="text" placeholder="world model, video, rl, llm">
      <small>可填写多个，用逗号分隔。</small>
    </label>
    <label>
      <span>二级方法标签</span>
      <input id="taxonomy-tags" type="text" placeholder="data process, theory, distill">
      <small>用于当前主题内筛选。</small>
    </label>
    <p class="local-note">“保存到本浏览器”只影响当前设备。永久修改请打开 GitHub 源文件，将值写入 <code>paper-topics</code> 和 <code>paper-tags</code>。</p>
    <div class="dialog-actions">
      <button id="reset-taxonomy" class="secondary-command" type="button">撤销本地修改</button>
      <a id="edit-on-github" class="secondary-command" href="#" target="_blank" rel="noreferrer">在 GitHub 永久修改</a>
      <button id="save-taxonomy" class="primary-command" type="button">保存到本浏览器</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const STORAGE_KEY = 'paper-reading-taxonomy-v2';
  const splitValues = value => [...new Set(value.split(/[,，;；|]/).map(item => item.trim()).filter(Boolean))];
  const normalize = value => value.trim().toLocaleLowerCase('zh-CN');
  const topicHome = document.getElementById('topic-home');
  const topicView = document.getElementById('topic-view');
  const topicGrid = document.getElementById('topic-grid');
  const activeTopicTitle = document.getElementById('active-topic-title');
  const backButton = document.getElementById('back-to-topics');
  const search = document.getElementById('paper-search');
  const filters = document.getElementById('tag-filters');
  const count = document.getElementById('result-count');
  const empty = document.getElementById('empty-results');
  const cards = [...document.querySelectorAll('.paper-card')];
  const dialog = document.getElementById('taxonomy-dialog');
  const dialogTitle = document.getElementById('taxonomy-paper-title');
  const topicsInput = document.getElementById('taxonomy-topics');
  const tagsInput = document.getElementById('taxonomy-tags');
  const githubEdit = document.getElementById('edit-on-github');
  let activeTopic = '';
  let activeTag = '';
  let editingCard = null;
  let overrides = {};

  try { overrides = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (_) { overrides = {}; }

  for (const card of cards) {
    const override = overrides[card.dataset.slug];
    if (override) {
      card.dataset.topics = override.topics.join('|');
      card.dataset.tags = override.tags.join('|');
      card.classList.add('locally-edited');
    }
    hydrateCard(card);
  }

  function hydrateCard(card) {
    card._topics = card.dataset.topics.split('|').map(item => item.trim()).filter(Boolean);
    card._tags = card.dataset.tags.split('|').map(item => item.trim()).filter(Boolean);
    card._search = normalize([card.dataset.title, card.dataset.summary, card.dataset.venue, ...card._tags].join(' '));
    const tagList = card.querySelector('.tag-list');
    tagList.replaceChildren(...card._tags.map(tag => {
      const item = document.createElement('span');
      item.className = 'tag';
      item.textContent = tag;
      return item;
    }));
  }

  function topicCounts() {
    const result = new Map();
    for (const card of cards) {
      for (const topic of card._topics) result.set(topic, (result.get(topic) || 0) + 1);
    }
    return result;
  }

  function renderTopics() {
    const counts = topicCounts();
    topicGrid.replaceChildren(...[...counts.entries()]
      .sort(([a], [b]) => a.localeCompare(b, 'zh-CN'))
      .map(([topic, total]) => {
        const button = document.createElement('button');
        button.className = 'topic-folder';
        button.type = 'button';
        button.dataset.topic = topic;
        button.innerHTML = '<span class="folder-tab"></span>';
        const name = document.createElement('strong');
        name.textContent = topic;
        const meta = document.createElement('span');
        meta.textContent = `${total} 篇论文`;
        button.append(name, meta);
        button.addEventListener('click', () => openTopic(topic));
        return button;
      }));
  }

  function openTopic(topic) {
    activeTopic = topic;
    activeTag = '';
    search.value = '';
    topicHome.hidden = true;
    topicView.hidden = false;
    activeTopicTitle.textContent = topic;
    history.replaceState(null, '', `#topic=${encodeURIComponent(topic)}`);
    renderTagFilters();
    applyFilters();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function closeTopic() {
    activeTopic = '';
    activeTag = '';
    topicView.hidden = true;
    topicHome.hidden = false;
    history.replaceState(null, '', location.pathname + location.search);
    renderTopics();
  }

  function renderTagFilters() {
    const topicCards = cards.filter(card => card._topics.includes(activeTopic));
    const tagCounts = new Map();
    for (const card of topicCards) {
      for (const tag of card._tags) tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1);
    }
    filters.replaceChildren(makeFilter('全部', '', topicCards.length), ...[...tagCounts.entries()]
      .sort(([a], [b]) => a.localeCompare(b, 'zh-CN'))
      .map(([tag, total]) => makeFilter(tag, tag, total)));
  }

  function makeFilter(label, tag, total) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tag-filter';
    button.dataset.tag = tag;
    button.setAttribute('aria-pressed', String(tag === activeTag));
    button.textContent = `${label} ${total}`;
    button.addEventListener('click', () => {
      activeTag = tag;
      for (const item of filters.children) item.setAttribute('aria-pressed', String(item.dataset.tag === tag));
      applyFilters();
    });
    return button;
  }

  function applyFilters() {
    const query = normalize(search.value);
    let visible = 0;
    for (const card of cards) {
      const matchesTopic = card._topics.includes(activeTopic);
      const matchesTag = !activeTag || card._tags.includes(activeTag);
      const matchesText = !query || card._search.includes(query);
      card.hidden = !(matchesTopic && matchesTag && matchesText);
      if (!card.hidden) visible += 1;
    }
    count.textContent = `显示 ${visible} 篇`;
    empty.hidden = visible !== 0;
  }

  function openEditor(card) {
    editingCard = card;
    dialogTitle.textContent = card.dataset.title;
    topicsInput.value = card._topics.join(', ');
    tagsInput.value = card._tags.join(', ');
    githubEdit.href = card.dataset.editUrl || '#';
    githubEdit.hidden = !card.dataset.editUrl;
    dialog.showModal();
  }

  function saveEditor() {
    if (!editingCard) return;
    const topics = splitValues(topicsInput.value);
    const tags = splitValues(tagsInput.value);
    if (!topics.length) {
      topicsInput.setCustomValidity('至少填写一个一级主题');
      topicsInput.reportValidity();
      return;
    }
    topicsInput.setCustomValidity('');
    overrides[editingCard.dataset.slug] = {topics, tags};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
    editingCard.dataset.topics = topics.join('|');
    editingCard.dataset.tags = tags.join('|');
    editingCard.classList.add('locally-edited');
    hydrateCard(editingCard);
    renderTopics();
    if (!editingCard._topics.includes(activeTopic)) closeTopic();
    else { renderTagFilters(); applyFilters(); }
    dialog.close();
  }

  function resetEditor() {
    if (!editingCard) return;
    delete overrides[editingCard.dataset.slug];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
    location.reload();
  }

  function exportEdits() {
    const payload = JSON.stringify(overrides, null, 2);
    const blob = new Blob([payload], {type: 'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'paper-taxonomy-overrides.json';
    link.click();
    URL.revokeObjectURL(link.href);
  }

  for (const button of document.querySelectorAll('.edit-taxonomy')) {
    button.addEventListener('click', event => openEditor(event.currentTarget.closest('.paper-card')));
  }
  backButton.addEventListener('click', closeTopic);
  search.addEventListener('input', applyFilters);
  document.getElementById('save-taxonomy').addEventListener('click', saveEditor);
  document.getElementById('reset-taxonomy').addEventListener('click', resetEditor);
  document.getElementById('export-edits').addEventListener('click', exportEdits);

  renderTopics();
  const initialTopic = new URLSearchParams(location.hash.slice(1)).get('topic');
  if (initialTopic && topicCounts().has(initialTopic)) openTopic(initialTopic);
})();
</script>
</body>
</html>
