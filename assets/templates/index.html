<!DOCTYPE html>
<!--
  Generated by scripts/build_index.py from metadata in reports/*.html.
  To edit a report's tags, change its <meta name="paper-tags"> value and rebuild.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="topic-title" content="{{TOPIC_DISPLAY_NAME}}">
<meta name="topic-description" content="{{TOPIC_DESCRIPTION}}">
<title>{{TOPIC_DISPLAY_NAME}} — Paper Reading 索引</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <h1>{{TOPIC_DISPLAY_NAME}}</h1>
  <p>{{TOPIC_DESCRIPTION}} · 共 {{PAPER_COUNT}} 篇</p>
</header>

<main class="index-wrap">
  <section class="index-tools" aria-label="报告检索">
    <label class="search-box">
      <span class="search-label">搜索</span>
      <input id="paper-search" type="search" placeholder="标题、摘要、会议或标签" autocomplete="off">
    </label>
    <div class="tag-filters" id="tag-filters" aria-label="按标签筛选"></div>
    <div class="result-count" id="result-count" aria-live="polite"></div>
  </section>

  <section id="comparison-section"{{COMPARISON_SECTION_HIDDEN}}>
    <h2 class="section-title">对比解读</h2>
    <div class="card-grid comparison-grid">
{{COMPARISON_CARDS}}
    </div>
  </section>

  <section>
    <h2 class="section-title">单篇解读</h2>
    <div class="card-grid" id="paper-grid">
{{PAPER_CARDS}}
    </div>
    <p class="empty-results" id="empty-results" hidden>没有匹配的报告。</p>
  </section>
</main>

<script>
(() => {
  const cards = [...document.querySelectorAll('#paper-grid .paper-card')];
  const search = document.getElementById('paper-search');
  const filters = document.getElementById('tag-filters');
  const count = document.getElementById('result-count');
  const empty = document.getElementById('empty-results');
  const tagCounts = new Map();
  let activeTag = '';

  const normalize = value => value.trim().toLocaleLowerCase('zh-CN');
  for (const card of cards) {
    card._tags = card.dataset.tags.split('|').map(tag => tag.trim()).filter(Boolean);
    card._search = normalize([
      card.dataset.title,
      card.dataset.summary,
      card.dataset.venue,
      ...card._tags
    ].join(' '));
    for (const tag of card._tags) tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1);
  }

  const makeFilter = (label, tag, total) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tag-filter';
    button.dataset.tag = tag;
    button.setAttribute('aria-pressed', tag === '' ? 'true' : 'false');
    button.textContent = `${label} ${total}`;
    button.addEventListener('click', () => {
      activeTag = tag;
      for (const item of filters.children) {
        item.setAttribute('aria-pressed', String(item.dataset.tag === activeTag));
      }
      applyFilters();
    });
    return button;
  };

  filters.appendChild(makeFilter('全部', '', cards.length));
  [...tagCounts.entries()]
    .sort(([a], [b]) => a.localeCompare(b, 'zh-CN'))
    .forEach(([tag, total]) => filters.appendChild(makeFilter(tag, tag, total)));

  function applyFilters() {
    const query = normalize(search.value);
    let visible = 0;
    for (const card of cards) {
      const matchesText = !query || card._search.includes(query);
      const matchesTag = !activeTag || card._tags.includes(activeTag);
      card.hidden = !(matchesText && matchesTag);
      if (!card.hidden) visible += 1;
    }
    count.textContent = `显示 ${visible} / ${cards.length}`;
    empty.hidden = visible !== 0;
  }

  search.addEventListener('input', applyFilters);
  applyFilters();
})();
</script>
</body>
</html>
